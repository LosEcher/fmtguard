[package]
name = "fmtguard"
version = "0.1.0"
edition = "2021"
description = "Scoped, gated Rust formatting for AI agents and incremental workflows. Never let the formatter decide the scope: you decide, fmtguard executes, gates validate."
license = "MIT"
repository = "https://github.com/LosEcher/fmtguard"
keywords = ["rustfmt", "formatting", "agent", "harness", "safe", "diff"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[[bin]]
name = "fmtguard"
path = "src/main.rs"
